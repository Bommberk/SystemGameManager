<link rel="stylesheet" href="../assets/style/gamemanager.css">

<h1>Game Manager</h1>
<div class="gamemanager container">
    <div class="head card">
        <img id="gameManagerImage" src="" alt="Game Manager">
        <div class="content">
            <h2>Game Manager</h2>
            <p><span id="gameAmount">0</span> Spiele - <span id="launcherAmount">0</span> Launcher</p>
            <p>Launcher, Spiele und schnelle Aktionen auf einen Blick.</p>
        </div>
    </div>
    <div class="launchers">
        <h2>Launcher</h2>
        <div class="launcherlist" expandable="true" id="launcherlist">
        </div>
    </div>
</div>
